[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-audio-sujet"
version = "1.0.0"
description = "Sujet Finance QA -> Edge-TTS -> Qwen3-Omni audio-to-text SFT dataset builder"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.2",
  "numpy>=1.26",
  "soundfile>=0.12.1",
  "datasets>=3.6,<5",
  "pyarrow>=16",
  "edge-tts==7.2.8",
  "huggingface-hub>=0.28",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
