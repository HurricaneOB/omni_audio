project:
  name: finance_audio_qwen3_omni_sujet_v1
  build_version: sujet_audio_v1.2_minimal_domain_filter
  language: en

source:
  hf_id: sujet-ai/Sujet-Finance-Instruct-177k
  split: train
  revision: 5e72431b6db6c339613ae809f4ae3c274ea1d0c7
  task_type: qa
  question_field: user_prompt
  answer_field: answer
  provenance_field: dataset

  # v1.2 minimal fix: finance-domain gate before TTS.
  # This policy is valid only for the pinned revision above.
  domain_filter:
    enabled: true
    policy: sujet_audited_finance_qa_v1
    fail_closed: true

    # Audited direct-QA finance prefix in the pinned Sujet snapshot.
    finance_alpaca_max_source_row_id: 62179

    # Other audited finance-native direct-QA upstream source(s).
    allowed_full_qa_datasets:
      - adityamavle/FinRiskAnalysis

    # Full scan invariants. Any mismatch aborts before TTS.
    expected_full_scan:
      raw_qa_rows: 38801
      kept_rows: 6770
      rejected_rows: 32031

    # First canonical Stanford-Alpaca sample observed in the pinned Sujet layout.
    boundary_sentinel:
      source_row_id: 62180
      upstream_dataset: gbharti/finance-alpaca
      user_prompt: "Question:\nGive three tips for staying healthy."

split:
  train: 0.98
  valid: 0.02
  method: stable_hash

tts_normalization:
  enabled: true
  deterministic_only: true
  llm_rewrite: false
  version: fin_en_tts_norm_v1
  pronunciation_file: configs/tts_pronunciation.yaml

edge_tts:
  dynamic_voice_discovery: true
  locales:
    - en-US
    - en-GB
    - en-AU
    - en-CA
    - en-IE
    - en-IN
  one_voice_per_sample: true
  rates:
    - "-4%"
    - "+0%"
    - "+4%"
  pitch: "+0Hz"
  concurrency: 4
  max_retries: 5
  base_retry_seconds: 2
  resumable: true
  keep_raw_mp3: false

audio:
  sample_rate: 16000
  channels: 1
  codec: pcm_s16le
  container: wav
  min_duration_sec: 0.5
  max_duration_sec: 60.0
  silence_rms_threshold: 0.00001

training_format:
  system_prompt: "You are a professional, accurate, and careful financial assistant."
  user_prompt: "<audio>Please answer the financial question in the audio."
  audio_path_mode: absolute

runtime:
  require_gpu: false
  run_model: false
