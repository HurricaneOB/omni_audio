  "P/E": "P E ratio"
  "P/B": "P B ratio"
  "EV/EBITDA": "E V to EBITDA"
  "10-K": "10 K"
  "10-Q": "10 Q"
  "8-K": "8 K"
  "EPS": "E P S"
  "ETF": "E T F"
  "IPO": "I P O"
  "SEC": "S E C"
  "ROE": "R O E"
  "ROA": "R O A"
  "YoY": "year over year"
  "QoQ": "quarter over quarter"
